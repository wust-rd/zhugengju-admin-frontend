# /etc/nginx/conf.d/zhugengju-admin-frontend.conf
server {
    listen 80;
    server_name 10.13.31.36;    # 内网自检用 curl -H "Host: 10.13.31.36" http://172.23.126.6/ 即可

    root  /data/frontend/zhugengju-admin-frontend/dist;    # web/dist 产物
    index index.html;
    charset utf-8;

    client_max_body_size 100m;           # 文件上传上限，按业务调整

    # —— API 反向代理：/js 原样透传到内网后端（与 dev proxy 行为一致，保留 /js 前缀）——
    location /js/ {
        proxy_pass http://172.23.126.2:8000;    # 注意结尾不带路径 = 原样透传

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;      # WebSocket（/js/websocket）
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    300s;         # 报表/导出等慢接口
        proxy_send_timeout    60s;
    }

    # —— 带 hash 的构建产物：长缓存 ——
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # —— history 路由 fallback：刷新/直达子路由不 404 ——
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，发版即生效（try_files 内部重定向会命中这里）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml application/wasm;
}
